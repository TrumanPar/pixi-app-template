[project]
name = "pixi-app-template"
version = "0.1.0"
description = "Change me: default template repo description"
readme = "README.md"
license = "LicenseRef-SLAC-BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [
    { name = "SLAC National Accelerator Laboratory" }
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9",
]
doc = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[project.scripts]
pixi-app-template = "pixi_app_template:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["B", "C", "D", "E", "F", "I", "W"]
extend-select = ["D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.uv]
# Avoid supply chain risk during uv build
exclude-newer = "7 days"
