[workspace]
authors = ["SLAC National Accelerator Laboratory"]
channels = ["conda-forge"]
name = "pixi-app-template"
# Force rhel7 compatibility
# Switch back to default platforms when rhel7 no longer needs to be supported
# platforms = ["linux-64"]
platforms = [
  { name = "rhel7", platform = "linux-64", glibc = "2.17", linux = "3.10" },
]
# Avoid supply chain risk while using pixi commands
exclude-newer = "7d"

[tasks]
test = "./pixi_tasks/test.sh"
docs = "cd docs && make html"
lint = "pre-commit run --all-files"

[dependencies]
python = ">=3.14.6,<3.15"

[pypi-dependencies]
pixi-app-template = { path = ".", editable = true, extras = ["doc", "test"] }
